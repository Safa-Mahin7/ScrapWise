name: scrapwise
description: "ScrapWise — Multilingual scrap collection and e-waste intelligence app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.20.0
  flutter_secure_storage: 11.2.0
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  generate: true
